<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Student Study Space - Profile</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            min-height: 100vh;

            color: #263238;

            background-image:

                linear-gradient(
                    rgba(255,255,255,0.35),
                    rgba(255,255,255,0.35)
                ),

                url("../assets/study-background.webp");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;

        }


        .container {

            width: 92%;

            max-width: 1050px;

            margin: auto;

            padding: 30px 0 50px;

        }


        /* HEADER */

        .header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 30px;

            padding: 20px 25px;

            background:
                rgba(255,255,255,0.75);

            backdrop-filter:
                blur(14px);

            border-radius: 20px;

            box-shadow:
                0 8px 30px
                rgba(50,50,50,0.12);

        }


        .header h1 {

            color: #304b52;

            font-size: 30px;

        }


        .header p {

            color: #607d82;

            margin-top: 5px;

        }


        .back-btn {

            text-decoration: none;

            color: #304b52;

            background: white;

            padding: 11px 18px;

            border-radius: 12px;

            font-weight: 600;

        }


        /* PROFILE */

        .profile-card {

            background:
                rgba(255,255,255,0.80);

            backdrop-filter:
                blur(15px);

            border-radius: 25px;

            padding: 35px;

            box-shadow:
                0 12px 35px
                rgba(50,50,50,0.13);

        }


        /* PROFILE TOP */

        .profile-top {

            text-align: center;

            padding-bottom: 30px;

            border-bottom:
                1px solid
                rgba(80,100,100,0.15);

        }


        .profile-avatar {

            width: 110px;

            height: 110px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #789b95,
                    #d99a9c
                );

            display: flex;

            justify-content: center;

            align-items: center;

            margin: auto;

            font-size: 48px;

            color: white;

            box-shadow:
                0 8px 20px
                rgba(50,50,50,0.15);

        }


        .profile-top h2 {

            margin-top: 15px;

            color: #304b52;

            font-size: 26px;

        }


        .profile-top p {

            color: #607d82;

            margin-top: 5px;

        }


        /* FORM */

        .form-section {

            margin-top: 30px;

        }


        .form-section h3 {

            color: #304b52;

            margin-bottom: 20px;

        }


        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;

        }


        .input-group {

            display: flex;

            flex-direction: column;

        }


        .input-group.full {

            grid-column:
                1 / -1;

        }


        label {

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;

            color: #52666b;

        }


        input,
        textarea {

            width: 100%;

            border: none;

            outline: none;

            background:
                rgba(255,255,255,0.9);

            border:
                1px solid
                rgba(80,100,100,0.15);

            border-radius: 12px;

            padding: 13px 15px;

            font-size: 15px;

            color: #263238;

            font-family: inherit;

        }


        textarea {

            min-height: 100px;

            resize: vertical;

        }


        input:focus,
        textarea:focus {

            border-color:
                #789b95;

            box-shadow:
                0 0 0 3px
                rgba(120,155,149,0.15);

        }


        /* BUTTONS */

        .button-section {

            display: flex;

            justify-content: center;

            gap: 12px;

            margin-top: 30px;

        }


        .save-btn {

            border: none;

            background:
                #587f78;

            color: white;

            padding:
                12px 25px;

            border-radius: 11px;

            cursor: pointer;

            font-size: 15px;

            font-weight: 600;

        }


        .save-btn:hover {

            background:
                #456b64;

        }


        .clear-btn {

            border: none;

            background:
                #c96f70;

            color: white;

            padding:
                12px 25px;

            border-radius: 11px;

            cursor: pointer;

            font-size: 15px;

        }


        .clear-btn:hover {

            background:
                #b55759;

        }


        /* INFO */

        .profile-info {

            margin-top: 35px;

            padding-top: 25px;

            border-top:
                1px solid
                rgba(80,100,100,0.15);

        }


        .profile-info h3 {

            color: #304b52;

            margin-bottom: 15px;

        }


        .info-box {

            background:
                rgba(255,255,255,0.6);

            padding: 15px;

            border-radius: 12px;

            margin-bottom: 10px;

            color: #52666b;

        }


        /* MOBILE */

        @media(max-width: 700px) {

            .container {

                width: 94%;

                padding-top: 18px;

            }


            .header {

                flex-direction: column;

                align-items: flex-start;

                gap: 15px;

            }


            .header h1 {

                font-size: 25px;

            }


            .profile-card {

                padding: 22px;

            }


            .form-grid {

                grid-template-columns: 1fr;

            }


            .input-group.full {

                grid-column: auto;

            }


            .button-section {

                flex-direction: column;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <div>

            <h1>👤 My Profile</h1>

            <p>
                Manage your Student Study Space profile.
            </p>

        </div>


        <a
            href="../index.html"
            class="back-btn">

            ← Back to Home

        </a>

    </div>



    <!-- PROFILE CARD -->

    <div class="profile-card">


        <!-- PROFILE TOP -->

        <div class="profile-top">

            <div
                class="profile-avatar"
                id="avatar">

                👤

            </div>


            <h2 id="displayName">
                Student
            </h2>


            <p id="displayCourse">
                Student
            </p>

        </div>



        <!-- EDIT PROFILE -->

        <div class="form-section">

            <h3>
                ✏️ Edit Profile
            </h3>


            <div class="form-grid">


                <!-- NAME -->

                <div class="input-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name">

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email">

                </div>


                <!-- COURSE -->

                <div class="input-group">

                    <label>
                        Course
                    </label>

                    <input
                        type="text"
                        id="course"
                        placeholder="Example: B.Tech AI & DS">

                </div>


                <!-- YEAR -->

                <div class="input-group">

                    <label>
                        Year
                    </label>

                    <input
                        type="text"
                        id="year"
                        placeholder="Example: III Year">

                </div>


                <!-- SECTION -->

                <div class="input-group">

                    <label>
                        Section
                    </label>

                    <input
                        type="text"
                        id="section"
                        placeholder="Example: Section C">

                </div>


                <!-- COLLEGE -->

                <div class="input-group">

                    <label>
                        College
                    </label>

                    <input
                        type="text"
                        id="college"
                        placeholder="Enter your college">

                </div>


                <!-- SKILLS -->

                <div class="input-group full">

                    <label>
                        Skills
                    </label>

                    <input
                        type="text"
                        id="skills"
                        placeholder="Example: Python, Figma, Canva">

                </div>


                <!-- ABOUT -->

                <div class="input-group full">

                    <label>
                        About Me
                    </label>

                    <textarea
                        id="about"
                        placeholder="Write something about yourself..."></textarea>

                </div>


            </div>



            <!-- BUTTONS -->

            <div class="button-section">

                <button
                    class="save-btn"
                    onclick="saveProfile()">

                    💾 Save Profile

                </button>


                <button
                    class="clear-btn"
                    onclick="clearProfile()">

                    🗑️ Clear

                </button>

            </div>

        </div>



        <!-- PROFILE SUMMARY -->

        <div class="profile-info">

            <h3>
                📋 Profile Summary
            </h3>


            <div class="info-box">

                <strong>
                    📧 Email:
                </strong>

                <span id="summaryEmail">
                    Not added
                </span>

            </div>


            <div class="info-box">

                <strong>
                    🎓 Course:
                </strong>

                <span id="summaryCourse">
                    Not added
                </span>

            </div>


            <div class="info-box">

                <strong>
                    🏫 College:
                </strong>

                <span id="summaryCollege">
                    Not added
                </span>

            </div>


            <div class="info-box">

                <strong>
                    💡 Skills:
                </strong>

                <span id="summarySkills">
                    Not added
                </span>

            </div>


            <div class="info-box">

                <strong>
                    📝 About:
                </strong>

                <span id="summaryAbout">
                    Not added
                </span>

            </div>

        </div>


    </div>

</div>



<script>


/* ==========================================
   PROFILE DATA
========================================== */

let profile =
    JSON.parse(
        localStorage.getItem(
            "studentProfile"
        )
    ) || {};


/* ==========================================
   SAVE PROFILE
========================================== */

function saveProfile() {

    profile = {

        name:
            document.getElementById(
                "name"
            ).value.trim(),

        email:
            document.getElementById(
                "email"
            ).value.trim(),

        course:
            document.getElementById(
                "course"
            ).value.trim(),

        year:
            document.getElementById(
                "year"
            ).value.trim(),

        section:
            document.getElementById(
                "section"
            ).value.trim(),

        college:
            document.getElementById(
                "college"
            ).value.trim(),

        skills:
            document.getElementById(
                "skills"
            ).value.trim(),

        about:
            document.getElementById(
                "about"
            ).value.trim()

    };


    localStorage.setItem(

        "studentProfile",

        JSON.stringify(profile)

    );


    displayProfile();


    alert(
        "✅ Profile saved successfully!"
    );

}



/* ==========================================
   DISPLAY PROFILE
========================================== */

function displayProfile() {

    const name =
        profile.name || "Student";


    const course =
        profile.course || "Student";


    document.getElementById(
        "displayName"
    ).textContent =
        name;


    document.getElementById(
        "displayCourse"
    ).textContent =

        profile.course

        ?

        profile.course +
        (
            profile.year
            ? " • " + profile.year
            : ""
        )

        :

        "Student";


    /* FORM */

    document.getElementById(
        "name"
    ).value =
        profile.name || "";


    document.getElementById(
        "email"
    ).value =
        profile.email || "";


    document.getElementById(
        "course"
    ).value =
        profile.course || "";


    document.getElementById(
        "year"
    ).value =
        profile.year || "";


    document.getElementById(
        "section"
    ).value =
        profile.section || "";


    document.getElementById(
        "college"
    ).value =
        profile.college || "";


    document.getElementById(
        "skills"
    ).value =
        profile.skills || "";


    document.getElementById(
        "about"
    ).value =
        profile.about || "";


    /* SUMMARY */

    document.getElementById(
        "summaryEmail"
    ).textContent =
        profile.email ||
        "Not added";


    document.getElementById(
        "summaryCourse"
    ).textContent =

        profile.course

        ?

        profile.course +
        (
            profile.year
            ? " • " + profile.year
            : ""
        )

        :

        "Not added";


    document.getElementById(
        "summaryCollege"
    ).textContent =
        profile.college ||
        "Not added";


    document.getElementById(
        "summarySkills"
    ).textContent =
        profile.skills ||
        "Not added";


    document.getElementById(
        "summaryAbout"
    ).textContent =
        profile.about ||
        "Not added";

}



/* ==========================================
   CLEAR PROFILE
========================================== */

function clearProfile() {

    const confirmClear =
        confirm(
            "Are you sure you want to clear your profile?"
        );


    if (!confirmClear) {

        return;

    }


    profile = {};


    localStorage.removeItem(
        "studentProfile"
    );


    displayProfile();


    alert(
        "Profile cleared."
    );

}



/* ==========================================
   LOAD PROFILE
========================================== */

displayProfile();


</script>


</body>

</html>
