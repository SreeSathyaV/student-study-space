<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Games | Student Study Space</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(255,255,255,0.8),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 80%,
                    rgba(210,225,255,0.8),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #eaf1ff,
                    #f7f1ff,
                    #eafaf5
                );

            color: #243447;

        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            width: 92%;

            max-width: 1200px;

            margin: auto;

            padding: 30px 0;

        }


        /* =========================
           HEADER
        ========================= */

        .back-btn {

            display: inline-block;

            text-decoration: none;

            color: #243447;

            font-weight: bold;

            margin-bottom: 25px;

        }


        header {

            text-align: center;

            margin-bottom: 35px;

        }


        header h1 {

            font-size: 42px;

            margin-bottom: 10px;

        }


        header p {

            color: #667085;

            font-size: 17px;

        }


        /* =========================
           GAME CARDS
        ========================= */

        .games-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(210px, 1fr)
                );

            gap: 22px;

        }


        .game-card {

            background:
                rgba(255,255,255,0.75);

            backdrop-filter: blur(15px);

            border: 1px solid
                rgba(255,255,255,0.9);

            border-radius: 22px;

            padding: 30px 20px;

            text-align: center;

            cursor: pointer;

            box-shadow:
                0 12px 30px
                rgba(40,50,80,0.10);

            transition:
                transform 0.25s,
                box-shadow 0.25s;

        }


        .game-card:hover {

            transform:
                translateY(-8px);

            box-shadow:
                0 18px 35px
                rgba(40,50,80,0.16);

        }


        .game-icon {

            font-size: 58px;

            margin-bottom: 15px;

        }


        .game-card h2 {

            margin-bottom: 8px;

        }


        .game-card p {

            color: #667085;

        }


        /* =========================
           GAME AREA
        ========================= */

        #gameArea {

            margin-top: 35px;

            background:
                rgba(255,255,255,0.82);

            backdrop-filter: blur(15px);

            border-radius: 25px;

            padding: 30px;

            min-height: 350px;

            text-align: center;

            box-shadow:
                0 15px 40px
                rgba(40,50,80,0.10);

        }


        #gameArea h2 {

            margin-bottom: 10px;

        }


        /* =========================
           BUTTONS
        ========================= */

        button {

            font-family: inherit;

        }


        .game-controls {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 20px;

        }


        .game-controls button {

            border: none;

            padding: 11px 20px;

            border-radius: 10px;

            background: #243447;

            color: white;

            cursor: pointer;

            font-weight: bold;

            transition: 0.2s;

        }


        .game-controls button:hover {

            transform:
                translateY(-2px);

            opacity: 0.9;

        }


        .pause-button {

            background: #d97706 !important;

        }


        .resume-button {

            background: #15803d !important;

        }


        .restart-button {

            background: #475569 !important;

        }


        /* =========================
           SCORE
        ========================= */

        .score-board {

            font-size: 20px;

            font-weight: bold;

            margin: 15px;

        }


        /* =========================
           SNAKE
        ========================= */

        #snakeCanvas {

            display: block;

            margin: 20px auto;

            max-width: 100%;

            background:
                linear-gradient(
                    135deg,
                    #f8fafc,
                    #eef2f7
                );

            border:
                3px solid #243447;

            border-radius: 12px;

        }


        .snake-message {

            font-weight: bold;

            min-height: 25px;

        }


        /* =========================
           BLOCK GAME
        ========================= */

        .block-board {

            display: grid;

            grid-template-columns:
                repeat(6, 55px);

            gap: 8px;

            justify-content: center;

            margin: 25px auto;

        }


        .block {

            width: 55px;

            height: 55px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    145deg,
                    #64748b,
                    #334155
                );

            color: white;

            font-size: 20px;

            cursor: pointer;

            transition: 0.2s;

        }


        .block:hover {

            transform:
                scale(1.08);

        }


        .block.removed {

            opacity: 0;

            transform:
                scale(0);

            pointer-events: none;

        }


        /* =========================
           TIC TAC TOE
        ========================= */

        .tic-board {

            display: grid;

            grid-template-columns:
                repeat(3, 90px);

            gap: 8px;

            justify-content: center;

            margin: 25px auto;

        }


        .tic-cell {

            width: 90px;

            height: 90px;

            border: none;

            border-radius: 14px;

            background: #f8fafc;

            font-size: 38px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 5px 15px
                rgba(0,0,0,0.08);

        }


        .tic-cell:hover {

            background: #e9eef5;

        }


        /* =========================
           MEMORY GAME
        ========================= */

        .memory-board {

            display: grid;

            grid-template-columns:
                repeat(4, 90px);

            gap: 12px;

            justify-content: center;

            margin: 25px auto;

        }


        .memory-card {

            width: 90px;

            height: 90px;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #334155,
                    #64748b
                );

            color: white;

            font-size: 35px;

            cursor: pointer;

            transition: 0.25s;

        }


        .memory-card:hover {

            transform:
                scale(1.05);

        }


        .memory-card.matched {

            background: #dcfce7;

            color: #166534;

            cursor: default;

        }


        /* =========================
           PAUSE OVERLAY
        ========================= */

        .paused-message {

            display: none;

            margin: 15px auto;

            padding: 12px 20px;

            width: fit-content;

            border-radius: 10px;

            background: #fff7ed;

            color: #c2410c;

            font-weight: bold;

        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width:600px) {

            header h1 {

                font-size: 32px;

            }


            #gameArea {

                padding: 20px;

            }


            .block-board {

                grid-template-columns:
                    repeat(6, 40px);

                gap: 5px;

            }


            .block {

                width: 40px;

                height: 40px;

            }


            .tic-board {

                grid-template-columns:
                    repeat(3, 70px);

            }


            .tic-cell {

                width: 70px;

                height: 70px;

                font-size: 30px;

            }


            .memory-board {

                grid-template-columns:
                    repeat(4, 65px);

                gap: 7px;

            }


            .memory-card {

                width: 65px;

                height: 65px;

                font-size: 27px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <a href="../index.html"
       class="back-btn">

        ← Back to Home

    </a>


    <header>

        <h1>🎮 Games</h1>

        <p>
            Take a short break and enjoy some fun mini games.
        </p>

    </header>


    <!-- GAME SELECTION -->

    <div class="games-grid">


        <div class="game-card"
             onclick="snakeGame()">

            <div class="game-icon">
                🐍
            </div>

            <h2>Snake</h2>

            <p>
                Classic snake challenge
            </p>

        </div>


        <div class="game-card"
             onclick="blockGame()">

            <div class="game-icon">
                🧱
            </div>

            <h2>Block Game</h2>

            <p>
                Clear blocks and score
            </p>

        </div>


        <div class="game-card"
             onclick="ticTacToe()">

            <div class="game-icon">
                ❌⭕
            </div>

            <h2>Tic-Tac-Toe</h2>

            <p>
                Challenge your opponent
            </p>

        </div>


        <div class="game-card"
             onclick="memoryGame()">

            <div class="game-icon">
                🧠
            </div>

            <h2>Memory Game</h2>

            <p>
                Match all the cards
            </p>

        </div>


    </div>


    <!-- GAME AREA -->

    <div id="gameArea">

        <h2>
            Choose a Game 🎮
        </h2>

        <p>
            Select any game above to start playing.
        </p>

    </div>


</div>


<script>


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let snakeInterval = null;

let snakePaused = false;

let blockPaused = false;

let memoryPaused = false;


/* =====================================================
   SNAKE GAME
===================================================== */

function snakeGame() {


    document.getElementById("gameArea").innerHTML = `

        <h2>🐍 Snake Game</h2>

        <div class="score-board">

            Score:
            <span id="snakeScore">
                0
            </span>

        </div>

        <canvas
            id="snakeCanvas"
            width="500"
            height="500">
        </canvas>

        <div
            id="snakePausedMessage"
            class="paused-message">

            ⏸ Game Paused

        </div>

        <div class="game-controls">

            <button
                class="pause-button"
                onclick="pauseSnake()">

                ⏸ Pause

            </button>

            <button
                class="resume-button"
                onclick="resumeSnake()">

                ▶ Resume

            </button>

            <button
                class="restart-button"
                onclick="snakeGame()">

                🔄 Restart

            </button>

        </div>

        <p>
            Use Arrow Keys to move the snake.
        </p>

        <p
            id="snakeStatus"
            class="snake-message">
        </p>

    `;


    startSnake();

}


function startSnake() {


    clearInterval(snakeInterval);


    const canvas =
        document.getElementById(
            "snakeCanvas"
        );


    const ctx =
        canvas.getContext("2d");


    const size = 20;


    let snake = [

        {
            x: 240,
            y: 240
        },

        {
            x: 220,
            y: 240
        },

        {
            x: 200,
            y: 240
        }

    ];


    let food =
        createSnakeFood();


    let direction = "RIGHT";


    let nextDirection = "RIGHT";


    let score = 0;


    snakePaused = false;


    document.onkeydown =
        function(event) {


            if (
                event.key === "ArrowUp" &&
                direction !== "DOWN"
            ) {

                nextDirection = "UP";

            }


            if (
                event.key === "ArrowDown" &&
                direction !== "UP"
            ) {

                nextDirection = "DOWN";

            }


            if (
                event.key === "ArrowLeft" &&
                direction !== "RIGHT"
            ) {

                nextDirection = "LEFT";

            }


            if (
                event.key === "ArrowRight" &&
                direction !== "LEFT"
            ) {

                nextDirection = "RIGHT";

            }

        };


    function gameLoop() {


        if (snakePaused)
            return;


        direction =
            nextDirection;


        let head = {

            x: snake[0].x,

            y: snake[0].y

        };


        if (direction === "UP")
            head.y -= size;


        if (direction === "DOWN")
            head.y += size;


        if (direction === "LEFT")
            head.x -= size;


        if (direction === "RIGHT")
            head.x += size;


        /* WALL COLLISION */

        if (

            head.x < 0 ||

            head.x >= canvas.width ||

            head.y < 0 ||

            head.y >= canvas.height

        ) {

            snakeGameOver();

            return;

        }


        /* BODY COLLISION */

        for (
            let part of snake
        ) {

            if (

                head.x === part.x &&

                head.y === part.y

            ) {

                snakeGameOver();

                return;

            }

        }


        snake.unshift(head);


        /* FOOD */

        if (

            head.x === food.x &&

            head.y === food.y

        ) {

            score++;


            document.getElementById(
                "snakeScore"
            ).textContent = score;


            food =
                createSnakeFood();

        }

        else {

            snake.pop();

        }


        drawSnake();

    }


    function drawSnake() {


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        /* FOOD */

        ctx.fillStyle =
            "#ef4444";


        ctx.beginPath();


        ctx.arc(

            food.x + 10,

            food.y + 10,

            9,

            0,

            Math.PI * 2

        );


        ctx.fill();


        /* SNAKE */

        snake.forEach(
            function(part, index) {


                ctx.fillStyle =
                    index === 0
                    ? "#172033"
                    : "#52657a";


                ctx.beginPath();


                ctx.roundRect(

                    part.x,

                    part.y,

                    18,

                    18,

                    5

                );


                ctx.fill();


            }
        );

    }


    function snakeGameOver() {


        clearInterval(
            snakeInterval
        );


        document.getElementById(
            "snakeStatus"
        ).textContent =

            "🎮 Game Over! Final Score: "
            + score;

    }


    snakeInterval =
        setInterval(
            gameLoop,
            110
        );


    function createSnakeFood() {


        return {

            x:
                Math.floor(
                    Math.random() * 25
                ) * 20,

            y:
                Math.floor(
                    Math.random() * 25
                ) * 20

        };

    }

}


function pauseSnake() {


    snakePaused = true;


    const message =
        document.getElementById(
            "snakePausedMessage"
        );


    if (message)
        message.style.display =
            "block";

}


function resumeSnake() {


    snakePaused = false;


    const message =
        document.getElementById(
            "snakePausedMessage"
        );


    if (message)
        message.style.display =
            "none";

}


/* =====================================================
   BLOCK GAME
===================================================== */

function blockGame() {


    document.getElementById(
        "gameArea"
    ).innerHTML = `

        <h2>🧱 Block Challenge</h2>

        <div class="score-board">

            Score:
            <span id="blockScore">
                0
            </span>

        </div>

        <div
            id="blockPausedMessage"
            class="paused-message">

            ⏸ Game Paused

        </div>

        <div
            id="blockBoard"
            class="block-board">
        </div>

        <div class="game-controls">

            <button
                class="pause-button"
                onclick="pauseBlocks()">

                ⏸ Pause

            </button>

            <button
                class="resume-button"
                onclick="resumeBlocks()">

                ▶ Resume

            </button>

            <button
                class="restart-button"
                onclick="blockGame()">

                🔄 Restart

            </button>

        </div>

    `;


    createBlockBoard();

}


function createBlockBoard() {


    const board =
        document.getElementById(
            "blockBoard"
        );


    board.innerHTML = "";


    blockPaused = false;


    let score = 0;


    for (
        let i = 0;
        i < 36;
        i++
    ) {


        const block =
            document.createElement(
                "button"
            );


        block.className =
            "block";


        block.textContent =
            "◆";


        block.onclick =
            function() {


                if (blockPaused)
                    return;


                if (
                    this.classList
                    .contains("removed")
                )
                    return;


                this.classList
                    .add("removed");


                score += 10;


                document.getElementById(
                    "blockScore"
                ).textContent =
                    score;


                if (
                    score === 360
                ) {

                    setTimeout(
                        function() {

                            alert(
                                "🎉 You cleared all blocks!"
                            );

                        },
                        100
                    );

                }

            };


        board.appendChild(
            block
        );

    }

}


function pauseBlocks() {


    blockPaused = true;


    const message =
        document.getElementById(
            "blockPausedMessage"
        );


    if (message)
        message.style.display =
            "block";

}


function resumeBlocks() {


    blockPaused = false;


    const message =
        document.getElementById(
            "blockPausedMessage"
        );


    if (message)
        message.style.display =
            "none";

}


/* =====================================================
   TIC TAC TOE
===================================================== */

function ticTacToe() {


    document.getElementById(
        "gameArea"
    ).innerHTML = `

        <h2>❌⭕ Tic-Tac-Toe</h2>

        <h3 id="ticStatus">

            Player X's Turn

        </h3>

        <div
            id="ticBoard"
            class="tic-board">
        </div>

        <div class="game-controls">

            <button
                class="restart-button"
                onclick="ticTacToe()">

                🔄 Restart

            </button>

        </div>

    `;


    let cells =
        Array(9).fill("");


    let player = "X";


    let gameOver = false;


    const board =
        document.getElementById(
            "ticBoard"
        );


    const status =
        document.getElementById(
            "ticStatus"
        );


    for (
        let i = 0;
        i < 9;
        i++
    ) {


        const cell =
            document.createElement(
                "button"
            );


        cell.className =
            "tic-cell";


        cell.onclick =
            function() {


                if (
                    cells[i] !== "" ||
                    gameOver
                )
                    return;


                cells[i] =
                    player;


                cell.textContent =
                    player;


                if (
                    checkWinner()
                ) {


                    status.textContent =

                        "🎉 Player "
                        + player
                        + " Wins!";


                    gameOver =
                        true;


                    return;

                }


                if (
                    !cells.includes("")
                ) {


                    status.textContent =
                        "🤝 It's a Draw!";


                    gameOver =
                        true;


                    return;

                }


                player =
                    player === "X"
                    ? "O"
                    : "X";


                status.textContent =

                    "Player "
                    + player
                    + "'s Turn";

            };


        board.appendChild(
            cell
        );

    }


    function checkWinner() {


        const combinations = [

            [0,1,2],

            [3,4,5],

            [6,7,8],

            [0,3,6],

            [1,4,7],

            [2,5,8],

            [0,4,8],

            [2,4,6]

        ];


        return combinations.some(
            function(combo) {


                const a = combo[0];

                const b = combo[1];

                const c = combo[2];


                return (

                    cells[a] &&

                    cells[a] === cells[b] &&

                    cells[a] === cells[c]

                );

            }
        );

    }

}


/* =====================================================
   MEMORY GAME
===================================================== */

function memoryGame() {


    document.getElementById(
        "gameArea"
    ).innerHTML = `

        <h2>🧠 Memory Match</h2>

        <div class="score-board">

            Moves:
            <span id="memoryMoves">
                0
            </span>

        </div>

        <div
            id="memoryPausedMessage"
            class="paused-message">

            ⏸ Game Paused

        </div>

        <div
            id="memoryBoard"
            class="memory-board">
        </div>

        <div class="game-controls">

            <button
                class="pause-button"
                onclick="pauseMemory()">

                ⏸ Pause

            </button>

            <button
                class="resume-button"
                onclick="resumeMemory()">

                ▶ Resume

            </button>

            <button
                class="restart-button"
                onclick="memoryGame()">

                🔄 Restart

            </button>

        </div>

    `;


    const symbols = [

        "🌟","🌟",

        "🍎","🍎",

        "🚀","🚀",

        "🐶","🐶",

        "🌈","🌈",

        "⚽","⚽"

    ];


    symbols.sort(
        () =>
            Math.random() - 0.5
    );


    const board =
        document.getElementById(
            "memoryBoard"
        );


    let firstCard = null;

    let secondCard = null;

    let lockBoard = false;

    let moves = 0;

    memoryPaused = false;


    symbols.forEach(
        function(symbol) {


            const card =
                document.createElement(
                    "button"
                );


            card.className =
                "memory-card";


            card.textContent =
                "?";


            card.dataset.symbol =
                symbol;


            card.onclick =
                function() {


                    if (

                        memoryPaused ||

                        lockBoard ||

                        this === firstCard ||

                        this.classList
                            .contains("matched")

                    )
                        return;


                    this.textContent =
                        symbol;


                    if (!firstCard) {

                        firstCard =
                            this;

                        return;

                    }


                    secondCard =
                        this;


                    moves++;


                    document.getElementById(
                        "memoryMoves"
                    ).textContent =
                        moves;


                    if (

                        firstCard.dataset
                            .symbol ===

                        secondCard.dataset
                            .symbol

                    ) {


                        firstCard.classList
                            .add("matched");


                        secondCard.classList
                            .add("matched");


                        resetCards();


                        const matched =
                            document
                            .querySelectorAll(
                                ".memory-card.matched"
                            )
                            .length;


                        if (
                            matched ===
                            symbols.length
                        ) {


                            setTimeout(
                                function() {

                                    alert(

                                        "🎉 You completed the Memory Game in "
                                        + moves
                                        + " moves!"

                                    );

                                },
                                300
                            );

                        }

                    }

                    else {


                        lockBoard =
                            true;


                        setTimeout(
                            function() {


                                if (
                                    firstCard
                                )
                                    firstCard
                                        .textContent =
                                        "?";


                                if (
                                    secondCard
                                )
                                    secondCard
                                        .textContent =
                                        "?";


                                resetCards();


                            },
                            800
                        );

                    }

                };


            board.appendChild(
                card
            );

        }
    );


    function resetCards() {


        firstCard = null;

        secondCard = null;

        lockBoard = false;

    }

}


function pauseMemory() {


    memoryPaused = true;


    const message =
        document.getElementById(
            "memoryPausedMessage"
        );


    if (message)
        message.style.display =
            "block";

}


function resumeMemory() {


    memoryPaused = false;


    const message =
        document.getElementById(
            "memoryPausedMessage"
        );


    if (message)
        message.style.display =
            "none";

}


</script>


</body>

</html>
