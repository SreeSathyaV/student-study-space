<html lang="en">

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Events - Study Space</title>

    <link rel="stylesheet" href="../styles.css">

</head>

<body>


<header class="navbar">

    <a href="../index.html" class="logo">
        📚 Study <span>Space</span>
    </a>

    <ul class="nav-links">

        <li><a href="../index.html">🏠 Home</a></li>

        <li><a href="notes.html">📝 Notes</a></li>

        <li><a href="tasks.html">✅ Tasks</a></li>

        <li>
            <a href="events.html" class="active">
                🗓️ Events
            </a>
        </li>

        <li><a href="planner.html">⏰ Planner</a></li>

        <li><a href="documents.html">📁 Documents</a></li>

        <li><a href="painting.html">🎨 Painting</a></li>

        <li><a href="games.html">🎮 Games</a></li>

        <li><a href="profile.html">👤 Profile</a></li>

    </ul>

</header>


<main>

<section class="page-hero">

    <div class="page-container">

        <div class="hero-content">

            <div class="hero-icon">
                🗓️
            </div>

            <h1>
                My <span>Events</span>
            </h1>

            <p>
                Keep track of assignments, exams,
                meetings and important dates.
            </p>

        </div>

    </div>

</section>


<section class="content-section">

    <div class="page-container">

        <div class="events-layout">


            <!-- CALENDAR -->

            <div class="calendar-box">

                <h2>📅 Calendar</h2>

                <input
                    type="date"
                    id="eventDate">

                <div
                    id="calendarEvents"
                    class="event-list">

                </div>

            </div>


            <!-- EVENT FORM -->

            <div class="event-form">

                <h2>➕ Add Event</h2>

                <div class="form-group">

                    <label>
                        Event Title
                    </label>

                    <input
                        type="text"
                        id="eventTitle"
                        placeholder="e.g. Deep Learning Assignment">

                </div>

                <br>

                <div class="form-group">

                    <label>
                        Date
                    </label>

                    <input
                        type="date"
                        id="eventDateInput">

                </div>

                <br>

                <div class="form-group">

                    <label>
                        Description
                    </label>

                    <textarea
                        id="eventDescription"
                        placeholder="Add event details...">
                    </textarea>

                </div>

                <br>

                <button
                    class="primary-btn"
                    onclick="addEvent()">

                    + Save Event

                </button>

            </div>

        </div>

    </div>

</section>

</main>


<footer>

    <p>
        © 2026 Study Space • Learn • Plan • Create
    </p>

</footer>


<script src="../script.js"></script>

</body>
</html>
