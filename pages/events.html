<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Events - Study Space</title>

    <link
        rel="stylesheet"
        href="../styles.css"
    >

</head>

<body>

<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <a href="../index.html" class="logo">
        📚 Study <span>Space</span>
    </a>

    <nav class="nav-links">

        <a href="../index.html">🏠 Home</a>

        <a href="notes.html">📝 Notes</a>

        <a href="tasks.html">✅ Tasks</a>

        <a href="events.html">📅 Events</a>

        <a href="planner.html">⏰ Planner</a>

        <a href="documents.html">📁 Documents</a>

        <a href="painting.html">🎨 Painting</a>

        <a href="games.html">🎮 Games</a>

        <a href="profile.html">👤 Profile</a>

    </nav>

</header>


<main class="page">

    <!-- HEADER -->

    <section class="page-header">

        <div class="icon">📅</div>

        <h1>My Events</h1>

        <p>
            Keep track of exams, assignments and important dates.
        </p>

    </section>


    <!-- CALENDAR + FORM -->

    <section class="events-layout">

        <!-- CALENDAR -->

        <div class="card">

            <div class="calendar-header">

                <h2 id="calendarMonth">
                    Month Year
                </h2>

                <div class="calendar-nav">

                    <button
                        onclick="changeMonth(-1)"
                    >
                        ‹
                    </button>

                    <button
                        onclick="changeMonth(1)"
                    >
                        ›
                    </button>

                </div>

            </div>


            <div class="calendar-weekdays">

                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>

            </div>


            <div
                id="calendarGrid"
                class="calendar-grid"
            ></div>

        </div>


        <!-- EVENT FORM -->

        <div class="card">

            <h2>➕ Create Event</h2>

            <div class="event-form">


                <div class="form-group">

                    <label for="eventTitle">
                        Event Title
                    </label>

                    <input
                        id="eventTitle"
                        type="text"
                        placeholder="e.g. Deep Learning Assignment"
                    >

                </div>


                <div class="form-group">

                    <label for="eventDate">
                        Date
                    </label>

                    <input
                        id="eventDate"
                        type="date"
                    >

                </div>


                <div class="form-group">

                    <label for="eventTime">
                        Time
                    </label>

                    <input
                        id="eventTime"
                        type="time"
                    >

                </div>


                <div class="form-group">

                    <label for="eventDescription">
                        Description
                    </label>

                    <textarea
                        id="eventDescription"
                        rows="4"
                        placeholder="Add some details..."
                    ></textarea>

                </div>


                <button
                    class="btn btn-primary"
                    onclick="addEvent()"
                >
                    📅 Save Event
                </button>

            </div>

        </div>

    </section>


    <!-- EVENTS -->

    <section class="card">

        <h2>
            📌 Events for Selected Date
        </h2>

        <div
            id="eventList"
            class="event-list"
        ></div>

    </section>

</main>


<script src="../script.js"></script>

<script>

    // Set today's date when page opens
    document.addEventListener("DOMContentLoaded", () => {

        const dateInput =
            document.getElementById("eventDate");

        if (dateInput) {

            dateInput.value =
                new Date().toISOString().split("T")[0];

        }

    });

</script>

</body>

</html>
