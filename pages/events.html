<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Events - Study Space</title>

    <link rel="stylesheet" href="../styles.css">

</head>


<body>


<nav class="navbar">

    <a href="../index.html" class="logo">
        📚 Study <span>Space</span>
    </a>

    <ul class="nav-links">

        <li><a href="../index.html">🏠 Home</a></li>

        <li><a href="notes.html">📝 Notes</a></li>

        <li><a href="tasks.html">✅ Tasks</a></li>

        <li><a href="events.html" class="active">
            📅 Events
        </a></li>

        <li><a href="planner.html">⏰ Planner</a></li>

        <li><a href="documents.html">📁 Documents</a></li>

        <li><a href="painting.html">🎨 Painting</a></li>

        <li><a href="games.html">🎮 Games</a></li>

        <li><a href="profile.html">👤 Profile</a></li>

    </ul>

</nav>


<main class="page">


    <!-- HERO -->

    <section class="page-hero">

        <div class="hero-content">

            <div class="hero-icon">📅</div>

            <h1>My Events</h1>

            <p>
                Keep track of assignments, exams and important dates.
            </p>

        </div>

    </section>


    <!-- EVENTS -->

    <section class="events-layout">


        <!-- CALENDAR -->

        <div class="card">

            <div class="calendar-header">

                <h2 id="calendarTitle">
                    September 2026
                </h2>

                <div class="calendar-buttons">

                    <button
                        class="small-btn"
                        onclick="previousMonth()">
                        ←
                    </button>

                    <button
                        class="small-btn"
                        onclick="nextMonth()">
                        →
                    </button>

                </div>

            </div>


            <div class="weekdays">

                <div class="weekday">SUN</div>
                <div class="weekday">MON</div>
                <div class="weekday">TUE</div>
                <div class="weekday">WED</div>
                <div class="weekday">THU</div>
                <div class="weekday">FRI</div>
                <div class="weekday">SAT</div>

            </div>


            <div
                id="calendar"
                class="calendar-grid">
            </div>

        </div>


        <!-- ADD EVENT -->

        <div class="card">

            <h2>➕ Add Event</h2>

            <div class="task-form">


                <div class="form-group">

                    <label>Event Title</label>

                    <input
                        type="text"
                        id="eventTitle"
                        placeholder="e.g. Deep Learning Assignment">

                </div>


                <div class="form-group">

                    <label>Date</label>

                    <input
                        type="date"
                        id="eventDate">

                </div>


                <div class="form-group">

                    <label>Time</label>

                    <input
                        type="time"
                        id="eventTime">

                </div>


                <div class="form-group">

                    <label>Description</label>

                    <textarea
                        id="eventDescription"
                        placeholder="Add some details..."></textarea>

                </div>


                <button
                    class="btn"
                    onclick="addEvent()">

                    + Save Event

                </button>

            </div>

        </div>

    </section>


    <!-- EVENT LIST -->

    <section
        class="card"
        style="margin-top:25px;">

        <h2>📌 Upcoming Events</h2>

        <div
            id="eventList"
            class="event-list">
        </div>

    </section>


</main>


<script src="../script.js"></script>

</body>
</html>
