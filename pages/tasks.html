<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tasks - Study Space</title>

    <link rel="stylesheet" href="../styles.css">
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <a href="../index.html" class="logo">
        📚 Study <span>Space</span>
    </a>

    <ul class="nav-links">

        <li><a href="../index.html">🏠 Home</a></li>

        <li><a href="notes.html">📝 Notes</a></li>

        <li><a href="tasks.html" class="active">✅ Tasks</a></li>

        <li><a href="events.html">📅 Events</a></li>

        <li><a href="planner.html">⏰ Planner</a></li>

        <li><a href="documents.html">📁 Documents</a></li>

        <li><a href="painting.html">🎨 Painting</a></li>

        <li><a href="games.html">🎮 Games</a></li>

        <li><a href="profile.html">👤 Profile</a></li>

    </ul>

</nav>


<main class="page">

    <!-- HERO -->

    <section class="page-hero">

        <div class="hero-content">

            <div class="hero-icon">✅</div>

            <h1>My Tasks</h1>

            <p>
                Plan your day, complete your goals and stay productive.
            </p>

        </div>

    </section>


    <!-- TASK CONTENT -->

    <section class="task-layout">


        <!-- ADD TASK -->

        <div class="card">

            <h2>➕ Add a New Task</h2>

            <div class="task-form">

                <div class="form-group">

                    <label>Task</label>

                    <input
                        type="text"
                        id="taskTitle"
                        placeholder="What do you need to do?">

                </div>


                <div class="form-group">

                    <label>Priority</label>

                    <select id="taskPriority">

                        <option value="High">
                            🔴 High
                        </option>

                        <option value="Medium" selected>
                            🟡 Medium
                        </option>

                        <option value="Low">
                            🟢 Low
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Due Date</label>

                    <input
                        type="date"
                        id="taskDate">

                </div>


                <button
                    class="btn"
                    onclick="addTask()">

                    + Add Task

                </button>

            </div>


            <!-- STATS -->

            <div class="stats">

                <div class="stat">

                    <strong id="totalTasks">0</strong>

                    <span>Total</span>

                </div>

                <div class="stat">

                    <strong id="completedTasks">0</strong>

                    <span>Completed</span>

                </div>

                <div class="stat">

                    <strong id="remainingTasks">0</strong>

                    <span>Remaining</span>

                </div>

            </div>

        </div>


        <!-- TASK LIST -->

        <div class="card">

            <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:15px;
                margin-bottom:20px;
            ">

                <h2 style="margin:0;">
                    📋 Your To-Do List
                </h2>

                <button
                    class="btn secondary"
                    onclick="clearCompletedTasks()">

                    Clear Completed

                </button>

            </div>


            <div
                id="taskList"
                class="task-list">
            </div>

        </div>

    </section>

</main>


<script src="../script.js"></script>

</body>
</html>
