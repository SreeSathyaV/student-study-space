<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tasks - Study Space</title>

    <link
        rel="stylesheet"
        href="../styles.css"
    >

</head>

<body>

<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <a href="../index.html" class="logo">
        📚 Study <span>Space</span>
    </a>

    <nav class="nav-links">

        <a href="../index.html">🏠 Home</a>

        <a href="notes.html">📝 Notes</a>

        <a href="tasks.html">✅ Tasks</a>

        <a href="events.html">📅 Events</a>

        <a href="planner.html">⏰ Planner</a>

        <a href="documents.html">📁 Documents</a>

        <a href="painting.html">🎨 Painting</a>

        <a href="games.html">🎮 Games</a>

        <a href="profile.html">👤 Profile</a>

    </nav>

</header>


<!-- ================= MAIN ================= -->

<main class="page">

    <!-- HEADER -->

    <section class="page-header">

        <div class="icon">✅</div>

        <h1>My Tasks</h1>

        <p>
            Plan your day, complete your goals and stay productive.
        </p>

    </section>


    <!-- TASK FORM -->

    <section class="card">

        <h2>➕ Add a New Task</h2>

        <div class="task-form">

            <div>

                <label for="taskInput">
                    Task
                </label>

                <input
                    id="taskInput"
                    type="text"
                    placeholder="What do you need to do?"
                    onkeydown="
                        if(event.key === 'Enter') addTask()
                    "
                >

            </div>


            <div>

                <label for="taskPriority">
                    Priority
                </label>

                <select id="taskPriority">

                    <option value="High">
                        🔴 High
                    </option>

                    <option value="Medium" selected>
                        🟡 Medium
                    </option>

                    <option value="Low">
                        🟢 Low
                    </option>

                </select>

            </div>


            <button
                class="btn btn-primary"
                onclick="addTask()"
            >
                + Add Task
            </button>

        </div>

    </section>


    <!-- STATISTICS -->

    <section class="card">

        <div class="task-stats">

            <div class="stat-card">

                <strong id="totalTasks">
                    0
                </strong>

                <span>Total Tasks</span>

            </div>


            <div class="stat-card">

                <strong id="completedTasks">
                    0
                </strong>

                <span>Completed</span>

            </div>


            <div class="stat-card">

                <strong id="remainingTasks">
                    0
                </strong>

                <span>Remaining</span>

            </div>

        </div>

    </section>


    <!-- TASK LIST -->

    <section class="card">

        <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:15px;
            margin-bottom:20px;
        ">

            <h2 style="margin:0;">
                📋 Your To-Do List
            </h2>

            <button
                class="btn btn-secondary"
                onclick="clearCompletedTasks()"
            >
                Clear Completed
            </button>

        </div>


        <div
            id="taskList"
            class="task-list"
        ></div>

    </section>

</main>


<script src="../script.js"></script>

</body>

</html>
