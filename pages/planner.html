<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Study Planner - Study Space</title>

    <link
        rel="stylesheet"
        href="../styles.css"
    >

</head>

<body>

<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <a href="../index.html" class="logo">
        📚 Study <span>Space</span>
    </a>

    <nav class="nav-links">

        <a href="../index.html">🏠 Home</a>

        <a href="notes.html">📝 Notes</a>

        <a href="tasks.html">✅ Tasks</a>

        <a href="events.html">📅 Events</a>

        <a href="planner.html">⏰ Planner</a>

        <a href="documents.html">📁 Documents</a>

        <a href="painting.html">🎨 Painting</a>

        <a href="games.html">🎮 Games</a>

        <a href="profile.html">👤 Profile</a>

    </nav>

</header>


<main class="page">

    <!-- HEADER -->

    <section class="page-header">

        <div class="icon">⏰</div>

        <h1>Study Planner</h1>

        <p>
            Create your personalized study schedule and manage your time.
        </p>

    </section>


    <!-- CREATE SCHEDULE -->

    <section class="card">

        <h2>➕ Create Study Schedule</h2>

        <div class="planner-form">


            <div>

                <label for="subjectInput">
                    Subject / Activity
                </label>

                <input
                    id="subjectInput"
                    type="text"
                    placeholder="e.g. Python"
                >

            </div>


            <div>

                <label for="startTime">
                    Start Time
                </label>

                <input
                    id="startTime"
                    type="time"
                >

            </div>


            <div>

                <label for="endTime">
                    End Time
                </label>

                <input
                    id="endTime"
                    type="time"
                >

            </div>


            <div>

                <label for="scheduleType">
                    Type
                </label>

                <select id="scheduleType">

                    <option value="Study">
                        📚 Study
                    </option>

                    <option value="Revision">
                        🔄 Revision
                    </option>

                    <option value="Assignment">
                        📝 Assignment
                    </option>

                    <option value="Project">
                        💻 Project
                    </option>

                    <option value="Break">
                        ☕ Break
                    </option>

                </select>

            </div>


            <button
                class="btn btn-primary"
                onclick="addSchedule()"
            >
                + Create
            </button>

        </div>

    </section>


    <!-- TODAY'S SCHEDULE -->

    <section class="card">

        <div style="
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:15px;
            margin-bottom:20px;
        ">

            <h2 style="margin:0;">
                📚 My Study Schedule
            </h2>

            <button
                class="btn btn-secondary"
                onclick="clearSchedules()"
            >
                Clear All
            </button>

        </div>


        <div
            id="scheduleList"
            class="schedule-list"
        ></div>

    </section>

</main>


<script src="../script.js"></script>

</body>

</html>
