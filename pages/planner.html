<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner - Study Space</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .planner-wrapper {
            padding: 2rem;
        }

        .schedule-form {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #1f2937;
        }

        .form-group input,
        .form-group select {
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .schedule-table {
            width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-top: 2rem;
        }

        .schedule-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .schedule-table th {
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: white;
            padding: 1rem;
            text-align: left;
            font-weight: 600;
        }

        .schedule-table td {
            padding: 1rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .schedule-table tr:hover {
            background-color: #f9fafb;
        }

        .schedule-table tr:last-child td {
            border-bottom: none;
        }

        .time-cell {
            font-weight: 600;
            color: #6366f1;
            width: 120px;
        }

        .subject-cell {
            color: #1f2937;
            font-weight: 500;
        }

        .activity-type {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .activity-study {
            background: #dbeafe;
            color: #0c4a6e;
        }

        .activity-break {
            background: #dcfce7;
            color: #166534;
        }

        .empty-schedule {
            text-align: center;
            padding: 3rem 2rem;
            color: #9ca3af;
        }

        .empty-schedule-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">📚 Study Space</div>
            <ul class="nav-menu">
                <li><a href="../index.html">🏠 Home</a></li>
                <li><a href="notes.html">📝 Notes</a></li>
                <li><a href="tasks.html">✅ Tasks</a></li>
                <li><a href="events.html">📅 Events</a></li>
                <li><a href="planner.html" class="active">⏰ Planner</a></li>
                <li><a href="documents.html">📂 Documents</a></li>
                <li><a href="painting.html">🎨 Painting</a></li>
                <li><a href="games.html">🎮 Games</a></li>
                <li><a href="profile.html">👤 Profile</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <div class="hero-content">
            <h1>⏰ Study Planner</h1>
            <p class="tagline">Create your personalized study schedule.</p>
        </div>
    </section>

    <!-- Main Content -->
    <div class="container">
        <div class="planner-wrapper">
            <!-- Schedule Form -->
            <div class="schedule-form">
                <h3 style="margin-bottom: 1.5rem;">+ Create Schedule</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Subject / Activity</label>
                        <input type="text" id="subject" placeholder="e.g., Python">
                    </div>
                    <div class="form-group">
                        <label>Start Time</label>
                        <input type="time" id="startTime">
                    </div>
                    <div class="form-group">
                        <label>End Time</label>
                        <input type="time" id="endTime">
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <select id="activityType">
                            <option value="study">Study</option>
                            <option value="break">Break</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>
                <button class="btn" style="width: 100%;" onclick="addSchedule()">+ Create Schedule</button>
            </div>

            <!-- Schedule Table -->
            <div class="schedule-table">
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Subject / Activity</th>
                            <th>Type</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../script.js"></script>
    <script>
        function addSchedule() {
            const subject = document.getElementById('subject').value.trim();
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const activityType = document.getElementById('activityType').value;

            if (!subject || !startTime || !endTime) {
                showNotification('Please fill in all fields', 'error');
                return;
            }

            if (startTime >= endTime) {
                showNotification('End time must be after start time', 'error');
                return;
            }

            const schedule = {
                subject,
                startTime,
                endTime,
                type: activityType
            };

            Storage.add('schedules', schedule);
            document.getElementById('subject').value = '';
            document.getElementById('startTime').value = '';
            document.getElementById('endTime').value = '';
            showNotification('Schedule added successfully!');
            loadSchedules();
        }

        function deleteSchedule(id) {
            if (confirm('Delete this schedule?')) {
                Storage.remove('schedules', id);
                showNotification('Schedule deleted');
                loadSchedules();
            }
        }

        function loadSchedules() {
            const schedules = Storage.get('schedules');
            const scheduleBody = document.getElementById('scheduleBody');
            
            const sorted = schedules.sort((a, b) => a.startTime.localeCompare(b.startTime));
            
            if (sorted.length === 0) {
                scheduleBody.innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align: center;">
                            <div class="empty-schedule">
                                <div class="empty-schedule-icon">📅</div>
                                <p>No schedules yet</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            scheduleBody.innerHTML = sorted.map(schedule => `
                <tr>
                    <td class="time-cell">${schedule.startTime} - ${schedule.endTime}</td>
                    <td class="subject-cell">${schedule.subject}</td>
                    <td>
                        <span class="activity-type activity-${schedule.type}">
                            ${schedule.type.toUpperCase()}
                        </span>
                    </td>
                    <td>
                        <button class="btn btn-danger" style="padding: 0.4rem 0.8rem; font-size: 0.9rem;" onclick="deleteSchedule(${schedule.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        loadSchedules();
    </script>
</body>
</html>
