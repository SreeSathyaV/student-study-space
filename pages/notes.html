<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Study Space - Notes</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at 10% 20%,
                    rgba(255,255,255,0.9),
                    transparent 30%),

                radial-gradient(circle at 90% 80%,
                    rgba(210,225,255,0.8),
                    transparent 35%),

                linear-gradient(135deg,
                    #eaf1ff,
                    #f7f1ff,
                    #eafaf5);

            min-height: 100vh;
            padding: 30px;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        /* HEADER */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
        }

        .header p {
            color: #666;
            margin-top: 5px;
        }

        .back-btn {
            text-decoration: none;
            background: white;
            color: #333;
            padding: 12px 20px;
            border-radius: 12px;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.1);
        }

        /* NOTE FORM */

        .note-form {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(15px);

            padding: 25px;
            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.1);

            margin-bottom: 30px;
        }

        .note-form h2 {
            margin-bottom: 20px;
        }

        input,
        textarea {
            width: 100%;

            border: 1px solid #ddd;
            border-radius: 12px;

            padding: 14px;
            margin-bottom: 15px;

            font-size: 15px;
            outline: none;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #6366f1;
        }

        .save-btn {
            background: #4f46e5;
            color: white;

            border: none;
            border-radius: 10px;

            padding: 12px 22px;

            cursor: pointer;
            font-size: 15px;
        }

        .save-btn:hover {
            background: #4338ca;
        }

        /* NOTES */

        .notes-header {
            margin-bottom: 15px;
        }

        .notes-header h2 {
            margin-bottom: 5px;
        }

        .notes-header p {
            color: #666;
        }

        .notes-container {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));

            gap: 20px;
        }

        .note-card {
            background: rgba(255,255,255,0.9);

            padding: 20px;

            border-radius: 18px;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.08);

            position: relative;

            transition: 0.2s;
        }

        .note-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 30px rgba(0,0,0,0.12);
        }

        .note-card h3 {
            margin-bottom: 12px;

            padding-right: 80px;

            color: #333;
        }

        .note-content {
            color: #555;

            line-height: 1.6;

            white-space: pre-wrap;

            margin-bottom: 45px;
        }

        /* DELETE BUTTON */

        .delete-btn {
            position: absolute;

            right: 15px;
            bottom: 15px;

            border: none;

            background: #ef4444;
            color: white;

            padding: 9px 14px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 13px;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        /* EDIT BUTTON */

        .edit-btn {
            position: absolute;

            right: 90px;
            bottom: 15px;

            border: none;

            background: #6366f1;
            color: white;

            padding: 9px 14px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 13px;
        }

        .edit-btn:hover {
            background: #4f46e5;
        }

        /* EMPTY */

        .empty-message {
            text-align: center;

            padding: 50px;

            background: rgba(255,255,255,0.7);

            border-radius: 18px;

            color: #777;

            grid-column: 1 / -1;
        }

        /* MOBILE */

        @media(max-width: 700px) {

            body {
                padding: 18px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .header h1 {
                font-size: 26px;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div>
            <h1>📝 My Notes</h1>

            <p>
                Create, save, edit and delete your study notes.
            </p>
        </div>

        <a
            href="../index.html"
            class="back-btn">
            ← Back to Home
        </a>

    </div>


    <!-- ADD NOTE -->

    <div class="note-form">

        <h2>➕ Add New Note</h2>

        <input
            type="text"
            id="noteTitle"
            placeholder="Enter note title"
        >

        <textarea
            id="noteContent"
            placeholder="Write your note here..."
        ></textarea>

        <button
            class="save-btn"
            onclick="saveNote()">

            💾 Save Note

        </button>

    </div>


    <!-- EXISTING NOTES -->

    <div class="notes-header">

        <h2>📚 Saved Notes</h2>

        <p>
            Your existing notes are shown below.
        </p>

    </div>


    <div
        id="notesContainer"
        class="notes-container">
    </div>


</div>


<script>

/* ==========================================
   GET EXISTING NOTES
========================================== */

let notes =
    JSON.parse(
        localStorage.getItem("studentNotes")
    ) || [];


/* ==========================================
   DISPLAY NOTES
========================================== */

function displayNotes() {

    const container =
        document.getElementById(
            "notesContainer"
        );


    container.innerHTML = "";


    /* NO NOTES */

    if (notes.length === 0) {

        container.innerHTML = `
            <div class="empty-message">

                <h3>📭 No Notes Yet</h3>

                <p>
                    Create your first study note above.
                </p>

            </div>
        `;

        return;
    }


    /* DISPLAY EACH NOTE */

    notes.forEach(
        (note, index) => {

            const card =
                document.createElement("div");

            card.className =
                "note-card";


            card.innerHTML = `

                <h3>
                    ${escapeHTML(note.title)}
                </h3>

                <div class="note-content">
                    ${escapeHTML(note.content)}
                </div>

                <button
                    class="edit-btn"
                    onclick="editNote(${index})">

                    ✏️ Edit

                </button>

                <button
                    class="delete-btn"
                    onclick="deleteNote(${index})">

                    🗑️ Delete

                </button>

            `;


            container.appendChild(card);

        }
    );

}


/* ==========================================
   SAVE NOTE
========================================== */

function saveNote() {

    const title =
        document
        .getElementById("noteTitle")
        .value
        .trim();


    const content =
        document
        .getElementById("noteContent")
        .value
        .trim();


    /* CHECK EMPTY */

    if (!title || !content) {

        alert(
            "Please enter both title and note content."
        );

        return;
    }


    /* ADD NOTE */

    notes.push({

        title: title,

        content: content

    });


    /* SAVE TO LOCAL STORAGE */

    localStorage.setItem(
        "studentNotes",
        JSON.stringify(notes)
    );


    /* CLEAR INPUT */

    document.getElementById(
        "noteTitle"
    ).value = "";


    document.getElementById(
        "noteContent"
    ).value = "";


    /* REFRESH */

    displayNotes();


    alert(
        "✅ Note saved successfully!"
    );

}


/* ==========================================
   DELETE NOTE
========================================== */

function deleteNote(index) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this note?"
        );


    if (!confirmDelete) {

        return;

    }


    /* REMOVE NOTE */

    notes.splice(
        index,
        1
    );


    /* UPDATE LOCAL STORAGE */

    localStorage.setItem(
        "studentNotes",
        JSON.stringify(notes)
    );


    /* REFRESH NOTES */

    displayNotes();

}


/* ==========================================
   EDIT NOTE
========================================== */

function editNote(index) {

    const note =
        notes[index];


    document.getElementById(
        "noteTitle"
    ).value =
        note.title;


    document.getElementById(
        "noteContent"
    ).value =
        note.content;


    /* DELETE OLD NOTE */

    notes.splice(
        index,
        1
    );


    localStorage.setItem(
        "studentNotes",
        JSON.stringify(notes)
    );


    displayNotes();


    /* SCROLL TO FORM */

    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* ==========================================
   SECURITY
========================================== */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* ==========================================
   LOAD NOTES WHEN PAGE OPENS
========================================== */

displayNotes();

</script>

</body>
</html>
