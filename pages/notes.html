<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Student Study Space - Notes</title>


    <style>

        /* ==============================
           BASIC RESET
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ==============================
           BODY
        ============================== */

        body {

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            min-height: 100vh;

            color: #263238;

            /* YOUR BACKGROUND IMAGE */

            background-image:

                linear-gradient(
                    rgba(255, 255, 255, 0.35),
                    rgba(255, 255, 255, 0.35)
                ),

                url("../assets/study-background.webp");


            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;

        }


        /* ==============================
           MAIN CONTAINER
        ============================== */

        .container {

            width: 92%;

            max-width: 1150px;

            margin: auto;

            padding: 30px 0 50px;

        }


        /* ==============================
           HEADER
        ============================== */

        .header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 30px;

            padding: 20px 25px;

            background:
                rgba(255,255,255,0.72);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            border-radius: 20px;

            border:
                1px solid
                rgba(255,255,255,0.7);

            box-shadow:
                0 8px 30px
                rgba(50,50,50,0.12);

        }


        .header-left h1 {

            font-size: 32px;

            color: #304b52;

            margin-bottom: 6px;

        }


        .header-left p {

            color: #607d82;

            font-size: 15px;

        }


        /* ==============================
           BACK BUTTON
        ============================== */

        .back-btn {

            text-decoration: none;

            color: #304b52;

            background:
                rgba(255,255,255,0.85);

            padding:
                11px 18px;

            border-radius: 12px;

            font-weight: 600;

            border:
                1px solid
                rgba(100,100,100,0.1);

            transition: 0.3s;

        }


        .back-btn:hover {

            transform:
                translateY(-2px);

            background: white;

        }


        /* ==============================
           ADD NOTE SECTION
        ============================== */

        .note-form {

            background:
                rgba(255,255,255,0.78);

            backdrop-filter:
                blur(15px);

            -webkit-backdrop-filter:
                blur(15px);

            padding: 28px;

            border-radius: 22px;

            margin-bottom: 35px;

            border:
                1px solid
                rgba(255,255,255,0.7);

            box-shadow:
                0 10px 35px
                rgba(50,50,50,0.12);

        }


        .note-form h2 {

            color: #304b52;

            margin-bottom: 20px;

            font-size: 22px;

        }


        /* ==============================
           INPUT
        ============================== */

        input,
        textarea {

            width: 100%;

            border: none;

            outline: none;

            background:
                rgba(255,255,255,0.9);

            border:
                1px solid
                rgba(80,100,100,0.15);

            border-radius: 13px;

            padding: 14px 16px;

            font-size: 15px;

            color: #263238;

            margin-bottom: 15px;

            font-family: inherit;

        }


        input:focus,
        textarea:focus {

            border:
                1px solid #8aa7a0;

            box-shadow:
                0 0 0 3px
                rgba(138,167,160,0.15);

        }


        textarea {

            min-height: 150px;

            resize: vertical;

            line-height: 1.6;

        }


        /* ==============================
           SAVE BUTTON
        ============================== */

        .save-btn {

            border: none;

            background:
                #587f78;

            color: white;

            padding:
                12px 22px;

            border-radius: 11px;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;

        }


        .save-btn:hover {

            background:
                #456b64;

            transform:
                translateY(-2px);

        }


        /* ==============================
           SAVED NOTES HEADER
        ============================== */

        .notes-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 18px;

            background:
                rgba(255,255,255,0.65);

            padding: 15px 20px;

            border-radius: 16px;

            backdrop-filter:
                blur(10px);

        }


        .notes-header h2 {

            color: #304b52;

        }


        .notes-header p {

            color: #607d82;

            font-size: 14px;

        }


        /* ==============================
           SEARCH
        ============================== */

        #searchNotes {

            width: 230px;

            margin: 0;

            padding: 10px 14px;

        }


        /* ==============================
           NOTES GRID
        ============================== */

        .notes-container {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 22px;

        }


        /* ==============================
           NOTE CARD
        ============================== */

        .note-card {

            position: relative;

            min-height: 220px;

            padding: 22px;

            background:
                rgba(255,255,255,0.82);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            border-radius: 20px;

            border:
                1px solid
                rgba(255,255,255,0.75);

            box-shadow:
                0 8px 25px
                rgba(50,50,50,0.10);

            transition: 0.3s;

        }


        .note-card:hover {

            transform:
                translateY(-5px);

            box-shadow:
                0 14px 35px
                rgba(50,50,50,0.16);

        }


        .note-card h3 {

            color: #304b52;

            font-size: 20px;

            margin-bottom: 12px;

            padding-right: 10px;

        }


        .note-content {

            color: #52666b;

            line-height: 1.7;

            white-space: pre-wrap;

            font-size: 15px;

            padding-bottom: 55px;

        }


        /* ==============================
           CARD BUTTON AREA
        ============================== */

        .button-area {

            position: absolute;

            bottom: 15px;

            left: 20px;

            right: 20px;

            display: flex;

            justify-content: flex-end;

            gap: 8px;

        }


        /* ==============================
           EDIT BUTTON
        ============================== */

        .edit-btn {

            border: none;

            background:
                #789b95;

            color: white;

            padding:
                8px 13px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 13px;

        }


        .edit-btn:hover {

            background:
                #5f847d;

        }


        /* ==============================
           DELETE BUTTON
        ============================== */

        .delete-btn {

            border: none;

            background:
                #c96f70;

            color: white;

            padding:
                8px 13px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 13px;

        }


        .delete-btn:hover {

            background:
                #b55759;

        }


        /* ==============================
           EMPTY MESSAGE
        ============================== */

        .empty-message {

            grid-column:
                1 / -1;

            text-align: center;

            padding: 50px 20px;

            background:
                rgba(255,255,255,0.75);

            backdrop-filter:
                blur(12px);

            border-radius: 20px;

            color: #607d82;

            box-shadow:
                0 8px 25px
                rgba(50,50,50,0.08);

        }


        .empty-message h3 {

            font-size: 22px;

            margin-bottom: 8px;

        }


        /* ==============================
           RESPONSIVE
        ============================== */

        @media(max-width: 700px) {

            .container {

                width: 94%;

                padding-top: 18px;

            }


            .header {

                flex-direction: column;

                align-items: flex-start;

                gap: 15px;

            }


            .header-left h1 {

                font-size: 26px;

            }


            .notes-header {

                flex-direction: column;

                align-items: flex-start;

                gap: 12px;

            }


            #searchNotes {

                width: 100%;

            }


            .note-form {

                padding: 20px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =====================================
         HEADER
    ====================================== -->

    <div class="header">

        <div class="header-left">

            <h1>📝 My Notes</h1>

            <p>
                Write, organize and manage your study notes.
            </p>

        </div>


        <a
            href="../index.html"
            class="back-btn">

            ← Back to Home

        </a>

    </div>



    <!-- =====================================
         ADD NOTE
    ====================================== -->

    <div class="note-form">

        <h2>
            ➕ Create New Note
        </h2>


        <input
            type="text"
            id="noteTitle"
            placeholder="Enter note title..."
        >


        <textarea
            id="noteContent"
            placeholder="Write your study notes here..."
        ></textarea>


        <button
            class="save-btn"
            onclick="saveNote()">

            💾 Save Note

        </button>

    </div>



    <!-- =====================================
         SAVED NOTES HEADER
    ====================================== -->

    <div class="notes-header">

        <div>

            <h2>
                📚 Saved Notes
            </h2>

            <p>
                Your notes are saved automatically.
            </p>

        </div>


        <input
            type="text"
            id="searchNotes"
            placeholder="🔍 Search notes..."
            oninput="searchNotes()"
        >

    </div>



    <!-- =====================================
         NOTES
    ====================================== -->

    <div
        id="notesContainer"
        class="notes-container">

    </div>


</div>



<script>


/* ==========================================
   LOAD NOTES FROM LOCAL STORAGE
========================================== */

let notes =
    JSON.parse(
        localStorage.getItem(
            "studentNotes"
        )
    ) || [];


let editingIndex = -1;



/* ==========================================
   DISPLAY NOTES
========================================== */

function displayNotes(
    notesToDisplay = notes
) {

    const container =
        document.getElementById(
            "notesContainer"
        );


    container.innerHTML = "";


    /* NO NOTES */

    if (
        notesToDisplay.length === 0
    ) {

        container.innerHTML = `

            <div class="empty-message">

                <h3>
                    📭 No Notes Found
                </h3>

                <p>
                    Create your first study note above.
                </p>

            </div>

        `;

        return;
    }



    /* CREATE NOTE CARDS */

    notesToDisplay.forEach(
        (note) => {

            const actualIndex =
                notes.indexOf(note);


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "note-card";


            card.innerHTML = `

                <h3>
                    ${escapeHTML(
                        note.title
                    )}
                </h3>


                <div class="note-content">
                    ${escapeHTML(
                        note.content
                    )}
                </div>


                <div class="button-area">

                    <button
                        class="edit-btn"
                        onclick="
                            editNote(
                                ${actualIndex}
                            )
                        ">

                        ✏️ Edit

                    </button>


                    <button
                        class="delete-btn"
                        onclick="
                            deleteNote(
                                ${actualIndex}
                            )
                        ">

                        🗑️ Delete

                    </button>

                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}



/* ==========================================
   SAVE NOTE
========================================== */

function saveNote() {

    const title =
        document
        .getElementById(
            "noteTitle"
        )
        .value
        .trim();


    const content =
        document
        .getElementById(
            "noteContent"
        )
        .value
        .trim();



    /* VALIDATION */

    if (
        title === "" ||
        content === ""
    ) {

        alert(
            "⚠️ Please enter both title and note content."
        );

        return;

    }



    /* EDIT EXISTING NOTE */

    if (
        editingIndex !== -1
    ) {

        notes[
            editingIndex
        ].title = title;


        notes[
            editingIndex
        ].content = content;


        editingIndex = -1;

    }

    /* ADD NEW NOTE */

    else {

        notes.push({

            title: title,

            content: content

        });

    }



    /* SAVE */

    localStorage.setItem(

        "studentNotes",

        JSON.stringify(
            notes
        )

    );



    /* CLEAR FORM */

    document.getElementById(
        "noteTitle"
    ).value = "";


    document.getElementById(
        "noteContent"
    ).value = "";



    /* CHANGE BUTTON TEXT */

    document.querySelector(
        ".save-btn"
    ).innerHTML =
        "💾 Save Note";



    displayNotes();


    alert(
        "✅ Note saved successfully!"
    );

}



/* ==========================================
   DELETE NOTE
========================================== */

function deleteNote(index) {

    const note =
        notes[index];


    const confirmDelete =
        confirm(

            `Are you sure you want to delete "${note.title}"?`

        );


    if (!confirmDelete) {

        return;

    }



    /* DELETE */

    notes.splice(
        index,
        1
    );



    /* UPDATE LOCAL STORAGE */

    localStorage.setItem(

        "studentNotes",

        JSON.stringify(
            notes
        )

    );



    /* DISPLAY */

    displayNotes();


}



/* ==========================================
   EDIT NOTE
========================================== */

function editNote(index) {

    const note =
        notes[index];


    document.getElementById(
        "noteTitle"
    ).value =
        note.title;


    document.getElementById(
        "noteContent"
    ).value =
        note.content;


    editingIndex =
        index;


    document.querySelector(
        ".save-btn"
    ).innerHTML =
        "✏️ Update Note";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}



/* ==========================================
   SEARCH NOTES
========================================== */

function searchNotes() {

    const searchText =
        document
        .getElementById(
            "searchNotes"
        )
        .value
        .toLowerCase()
        .trim();


    const filteredNotes =
        notes.filter(
            note =>

                note.title
                .toLowerCase()
                .includes(
                    searchText
                )

                ||

                note.content
                .toLowerCase()
                .includes(
                    searchText
                )
        );


    displayNotes(
        filteredNotes
    );

}



/* ==========================================
   SECURITY
========================================== */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}



/* ==========================================
   LOAD NOTES
========================================== */

displayNotes();


</script>


</body>

</html>
